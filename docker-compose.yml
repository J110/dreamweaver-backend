version: '3.8'

services:
  backend:
    image: dreamweaver-backend-app
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dreamweaver-backend
    user: "1001:1002"  # Match host user anmolmohan (uid=1001, gid=1002)
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./cache:/app/cache
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./firebase-push-credentials.json:/app/firebase-push-credentials.json:ro
      - ./seed_output:/app/seed_output
      - ./data:/app/data
      - ./audio:/app/audio:ro
      - ./clips:/app/clips
      - ./public:/app/public
      - /opt/dreamweaver-web/public:/opt/dreamweaver-web/public:ro
      - /opt/audio-store:/opt/audio-store
      - /opt/cover-store:/opt/cover-store
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - dreamweaver-network

  content-worker:
    image: dreamweaver-backend-app
    container_name: dreamweaver-content-worker
    user: "1001:1002"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    volumes:
      - ./cache:/app/cache
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./seed_output:/app/seed_output:ro
      - ./data:/app/data
      - ./audio:/app/audio:ro
      - ./clips:/app/clips
      - ./public:/app/public
      - /opt/dreamweaver-web/public:/opt/dreamweaver-web/public:ro
      - /opt/audio-store:/opt/audio-store
      - /opt/cover-store:/opt/cover-store
    command: ["python", "scripts/run_content_generation_worker.py"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dreamweaver-network

networks:
  dreamweaver-network:
    driver: bridge
