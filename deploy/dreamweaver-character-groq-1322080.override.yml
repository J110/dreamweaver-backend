services:
  backend:
    image: dreamweaver-backend:content-song-503c446
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - ./cache:/app/cache
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./firebase-push-credentials.json:/app/firebase-push-credentials.json:ro
      - ./seed_output:/app/seed_output
      - ./data:/app/data
      - ./audio:/app/audio:ro
      - ./clips:/app/clips
      - ./public:/app/public
      - /opt/dreamweaver-web/public:/opt/dreamweaver-web/public:ro
      - /opt/audio-store:/opt/audio-store
      - /opt/cover-store:/opt/cover-store
      - /opt/character-media:/opt/character-media
  content-worker:
    image: dreamweaver-backend:content-song-503c446
    container_name: dreamweaver-content-worker
    user: "1001:1002"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    volumes:
      - ./.worktrees/content-song-503c446/scripts:/app/scripts:ro
      - ./cache:/app/cache
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      - ./firebase-push-credentials.json:/app/firebase-push-credentials.json:ro
      - ./seed_output:/app/seed_output
      - ./data:/app/data
      - ./audio:/app/audio:ro
      - ./clips:/app/clips
      - ./public:/app/public
      - /opt/dreamweaver-web/public:/opt/dreamweaver-web/public:ro
      - /opt/audio-store:/opt/audio-store
      - /opt/cover-store:/opt/cover-store
      - /opt/character-media:/opt/character-media
    command: ["python", "scripts/run_content_generation_worker.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; raise SystemExit(0 if 'run_content_generation_worker.py' in Path('/proc/1/cmdline').read_bytes().decode(errors='ignore') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dreamweaver-network
